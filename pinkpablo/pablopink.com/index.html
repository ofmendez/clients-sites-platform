<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMING SOON</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        h1 {
            font-size: clamp(2.5rem, 4vw, 6rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            animation: fade 4s ease-in-out infinite;
            user-select: none;
        }

        @keyframes fade {
    0% {
        opacity: 1;
    }

    50% {
        opacity: 0.2;
    }

    100% {
        opacity: 1;
    }
}
    </style>
</head>
<body>

    <h1>Coming Soon</h1>

</body>
</html>
