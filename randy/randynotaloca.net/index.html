<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MUY PRONTO...</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    main {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .coming-soon {
      font-size: clamp(2.5rem, 7vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      text-align: center;

      opacity: 0;
      transform: translateY(12px);
      transition:
        opacity 1.8s ease,
        transform 1.8s ease;
    }

    .coming-soon.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .coming-soon.fade {
      opacity: 0.35;
    }
  </style>
</head>

<body>

  <main>
    <h1 class="coming-soon">MUY PRONTO...</h1>
  </main>

  <script>
    const text = document.querySelector('.coming-soon');

    // Entrada inicial
    window.addEventListener('load', () => {
      setTimeout(() => {
        text.classList.add('visible');
      }, 200);
    });

    // Respiración suave de opacidad
    setInterval(() => {
      text.classList.toggle('fade');
    }, 2200);
  </script>

</body>
</html>
