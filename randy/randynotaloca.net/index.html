<script>
  const petals = [...document.querySelectorAll(".petal")];
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  const states = petals.map((petal, index) => ({
    element: petal,
    fall: Number(petal.dataset.fall),
    drift: Number(petal.dataset.drift),
    turn: Number(petal.dataset.turn),
    flip: Number(petal.dataset.flip || 1),
    ease: 0.045 + index * 0.012,
    currentX: 0,
    currentY: 0,
    currentRotation: 0
  }));

  let targetScroll = window.scrollY;
  let frame = null;

  function animatePetals() {
    let moving = false;

    for (const petal of states) {
      const targetY = Math.min(targetScroll * petal.fall, 130);
      const targetX = Math.max(-45, Math.min(targetScroll * petal.drift, 45));
      const targetRotation = Math.min(targetScroll / 900, 1) * petal.turn;

      petal.currentY += (targetY - petal.currentY) * petal.ease;
      petal.currentX += (targetX - petal.currentX) * petal.ease;
      petal.currentRotation +=
        (targetRotation - petal.currentRotation) * petal.ease;

      petal.element.style.transform = `
        translate3d(${petal.currentX}px, ${petal.currentY}px, 0)
        rotate(${petal.currentRotation}deg)
        scaleX(${petal.flip})
      `;

      if (
        Math.abs(targetY - petal.currentY) > 0.1 ||
        Math.abs(targetX - petal.currentX) > 0.1 ||
        Math.abs(targetRotation - petal.currentRotation) > 0.1
      ) {
        moving = true;
      }
    }

    frame = moving ? requestAnimationFrame(animatePetals) : null;
  }

  function updatePetals() {
    if (reduceMotion.matches) return;
    targetScroll = window.scrollY || window.pageYOffset || 0;
    if (frame === null) frame = requestAnimationFrame(animatePetals);
  }

  // Safari puede diferir la notificación de scroll durante el gesto táctil.
  window.addEventListener("scroll", updatePetals, { passive: true });
  window.addEventListener("touchmove", updatePetals, { passive: true });
  window.addEventListener("pageshow", updatePetals);
  reduceMotion.addEventListener("change", updatePetals);
</script>
